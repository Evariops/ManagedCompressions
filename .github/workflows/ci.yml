name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job in this workflow needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  hooks:
    name: Hooks (betterleaks + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI mirror of the local prek hooks — local hooks are bypassable.
      - name: prek run --all-files
        run: pipx run prek run --all-files

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version matches the zizmor-pre-commit rev in .pre-commit-config.yaml.
      - name: zizmor (pedantic)
        run: pipx run zizmor==1.30.1 --persona=pedantic --no-online-audits .github/workflows/

  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The whole solution, so that the benchmarks keep compiling. They never run here: their figures
      # mean something on a quiet machine only, and they are measured by hand.
      - name: Build
        run: dotnet build ManagedCompressions.slnx -c Release

      # zstd's golden files and a decodecorpus corpus, which the repository does not keep: written from
      # zstd 1.5.7's release, checked against its SHA-256. With CI=true, a test that misses them fails.
      - name: Write the Zstandard test data
        run: bash tools/native-ref/testdata.sh

      # libzstd built with threads, the oracle of the parallel compression tests, which skip without it.
      - name: Build libzstd with threads
        run: bash tools/native-ref/build.sh mt

      - name: Test
        run: dotnet test --solution ManagedCompressions.slnx --no-build -c Release
