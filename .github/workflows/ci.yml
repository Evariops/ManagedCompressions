name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing the draft release that Release Drafter keeps creates the tag and runs everything again
  # on it, then the publish job below.
  release:
    types: [published]

# Least privilege by default; only the publish job raises what it needs, and none writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  hooks:
    name: Hooks (betterleaks + zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI mirror of the local prek hooks — local hooks are bypassable.
      - name: prek run --all-files
        run: pipx run prek run --all-files

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version matches the zizmor-pre-commit rev in .pre-commit-config.yaml.
      - name: zizmor (pedantic)
        run: pipx run zizmor==1.30.1 --persona=pedantic --no-online-audits .github/workflows/

  # Also packs, so that the check the branch rule requires covers the packages: a release pushes what
  # this job built and tested, and nothing built elsewhere.
  test:
    name: Build & Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A release v1.2.3 is built as 1.2.3: the assemblies, and the packages the publish job pushes.
      # Any other run leaves the version unset and packs the SDK's default, a file name and not a claim.
      - name: Resolve the version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a v followed by a SemVer version"
              exit 1
            fi
            echo "VERSION_PROPERTY=-p:Version=$version" >> "$GITHUB_ENV"
          fi

      # The whole solution, so that the benchmarks keep compiling. They never run here: their figures
      # mean something on a quiet machine only, and they are measured by hand.
      - name: Build
        run: dotnet build ManagedCompressions.slnx -c Release ${VERSION_PROPERTY:+"$VERSION_PROPERTY"}

      # zstd's golden files and a decodecorpus corpus, which the repository does not keep: written from
      # zstd 1.5.7's release, checked against its SHA-256. With CI=true, a test that misses them fails.
      - name: Write the Zstandard test data
        run: bash tools/native-ref/testdata.sh

      # libzstd built with threads, the oracle of the parallel compression tests, which skip without it.
      - name: Build libzstd with threads
        run: bash tools/native-ref/build.sh mt

      - name: Test
        run: dotnet test --solution ManagedCompressions.slnx --no-build -c Release

      # The packages are what a consumer gets, and nothing else here builds them. Most of what can go
      # wrong is visible at pack time and nowhere else: a readme that stops being found, a license
      # expression that stops parsing. Warnings are errors, so a pack warning fails the job.
      - name: Pack
        run: dotnet pack ManagedCompressions.slnx --no-build -c Release ${VERSION_PROPERTY:+"$VERSION_PROPERTY"}

      # Exactly the two libraries, each with its symbols, its documentation, its readme, and the BSD
      # notices of zstd and lz4 that NOTICE carries: their licenses ask a binary distribution for them.
      # A project that becomes packable by accident fails here too.
      - name: Check the packages
        run: |
          set -euo pipefail
          stray=$(find . -name '*.nupkg' -not -path './src/ManagedCompressions.Zstd/*' -not -path './src/ManagedCompressions.Lz4/*')
          if [ -n "$stray" ]; then
            echo "::error::packages from a project that should not pack: $stray"
            exit 1
          fi
          for id in ManagedCompressions.Zstd ManagedCompressions.Lz4; do
            packages=(src/"$id"/bin/Release/"$id".*.nupkg)
            if [ "${#packages[@]}" -ne 1 ] || [ ! -f "${packages[0]}" ]; then
              echo "::error::expected one $id package, found: ${packages[*]}"
              exit 1
            fi
            package=${packages[0]}
            contents=$(unzip -Z1 "$package")
            for entry in README.md NOTICE LICENSE "lib/[^/]+/$id\.dll" "lib/[^/]+/$id\.xml"; do
              if ! grep -qxE "$entry" <<< "$contents"; then
                echo "::error::$package has no $entry"
                exit 1
              fi
            done
            if [ ! -f "${package%.nupkg}.snupkg" ]; then
              echo "::error::$package has no symbol package"
              exit 1
            fi
            echo "$package: complete"
          done

      # A release's packages are kept for the publish job, which pushes them only once every job of
      # the run has passed.
      - name: Gather the packages of a release
        if: github.event_name == 'release'
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cp src/*/bin/Release/*.nupkg src/*/bin/Release/*.snupkg "$RUNNER_TEMP/packages/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  # A published release's packages go to nuget.org, under the Evariops account. Trusted Publishing
  # trades the job's GitHub OIDC token for an API key that lives an hour, so no key is stored here; the
  # policy nuget.org holds names this repository, this file (ci.yml) and the release environment:
  # renaming either stops the push.
  publish:
    name: Publish to nuget.org
    needs: [hooks, zizmor, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # the OIDC token Trusted Publishing trades for a nuget.org key that lives an hour
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # The user is the nuget.org account that created the trusted publishing policy, not the
      # Evariops organization that owns the packages. It is a variable of the release environment,
      # read when the job runs, so a change of account needs no new tag: re-run the failed job.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Each .snupkg goes up with its .nupkg. A package already there is skipped, so a push that
      # failed halfway can be re-run.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" --skip-duplicate \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
